<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Watch Together</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- LOBBY -->

        <section id="lobby" class="card">

            <h1>Watch Together</h1>

            <p class="subtitle">
                Watch the same local video with a friend.
            </p>

            <label for="nameInput">
                Your name
            </label>

            <input
                id="nameInput"
                type="text"
                maxlength="24"
                placeholder="Enter your name"
                autocomplete="off"
            >

            <button id="createRoomButton">
                Create Room
            </button>

            <div class="divider">
                <span>OR</span>
            </div>

            <label for="roomInput">
                Room code
            </label>

            <input
                id="roomInput"
                type="text"
                maxlength="6"
                placeholder="ABC123"
                autocomplete="off"
            >

            <button id="joinRoomButton">
                Join Room
            </button>

            <p id="lobbyStatus" class="status"></p>

        </section>


        <!-- WATCH ROOM -->

        <section id="watchRoom" hidden>

            <header class="roomHeader">

                <div>
                    <h1>Watch Together</h1>

                    <div>
                        Room:
                        <strong id="roomCodeDisplay">
                            ------
                        </strong>
                    </div>
                </div>

                <div
                    id="presence"
                    class="presence"
                >
                    Waiting for friend...
                </div>

            </header>


            <!-- LOCAL FILE -->

            <section class="card fileCard">

                <label
                    for="videoFile"
                    class="fileButton"
                >
                    Select Movie
                </label>

                <input
                    id="videoFile"
                    type="file"
                    accept="video/*"
                    hidden
                >

                <span id="fileName">
                    No movie selected
                </span>

                <p class="small">
                    Your movie stays on your device.
                    It is never uploaded to the server.
                </p>

            </section>


            <!-- VIDEO -->

            <section class="videoCard">

                <video
                    id="video"
                    controls
                    playsinline
                    preload="metadata"
                ></video>

            </section>


            <!-- CHAT -->

            <section class="card chatCard">

                <h2>Chat</h2>

                <div
                    id="messages"
                    class="messages"
                    aria-live="polite"
                ></div>

                <form id="chatForm">

                    <input
                        id="chatInput"
                        type="text"
                        maxlength="500"
                        placeholder="Type a message..."
                        autocomplete="off"
                    >

                    <button type="submit">
                        Send
                    </button>

                </form>

            </section>

        </section>

    </main>

    <script src="app.js"></script>

</body>

                    </html>
